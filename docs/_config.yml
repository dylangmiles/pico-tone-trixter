# Redirect-only site.
#
# The Tone Trixter build log moved to https://dylangmiles.github.io/tone-trixter/
# on 2026-08-13 (repo: dylangmiles/tone-trixter) so it could span both the RP2350
# and Daisy Seed3 builds instead of living inside one firmware repo.
#
# What remains here:
#   redirects/  — permalink stubs for every old URL, pointing at the new site
#   assets/og/  — the Open Graph images, KEPT so social cards already shared on
#                 WhatsApp/X/LinkedIn keep rendering; those cached cards embed
#                 the absolute image URL, which would 404 if these were deleted.
#
# Do NOT archive this repo: archiving disables Actions, the site stops building,
# and every old link dies. GitHub cannot redirect a Pages URL server-side — only
# a live site can serve the redirect.

title: Tone Trixter (moved)
description: >-
  This build log has moved to https://dylangmiles.github.io/tone-trixter/
author: Dylan Miles

url: "https://dylangmiles.github.io"
baseurl: "/pico-tone-trixter"

theme: minima

# jekyll-sitemap deliberately dropped: the old site must not publish a sitemap
# competing with the new one in search. Every stub also carries robots noindex
# and a canonical pointing at the new URL.
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
